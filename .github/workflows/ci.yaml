name: Validate static site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate HTML and internal links
        run: python3 scripts/validate_site.py

      - name: Build Docker image
        run: docker build -t aditya-site:ci .

      - name: Smoke test container
        run: |
          cid=$(docker run -d -p 8080:80 aditya-site:ci)
          trap 'docker rm -f "$cid"' EXIT
          sleep 2
          curl --fail http://127.0.0.1:8080/
          curl --fail http://127.0.0.1:8080/blog/
          curl --fail http://127.0.0.1:8080/projects/
          curl --fail http://127.0.0.1:8080/404.html
          status=$(curl --silent --output /dev/null --write-out "%{http_code}" http://127.0.0.1:8080/does-not-exist)
          test "$status" = "404"

